{% extends 'base.html' %}
{% block content %}

<div class="contact-page">
    <h1 class="contact-h1">Contact</h1>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div class="Inputs">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Send</button>
        </form>
    </div>
</div>
{% endblock %}
